# Soak mode (Phase 4): DRY_RUN stays on, metrics go to the soak JSONL.
# Install with: mkdir -p /etc/systemd/system/liquidation.service.d && \
#                 cp deploy/systemd/soak.conf /etc/systemd/system/liquidation.service.d/
# Then: systemctl daemon-reload && systemctl restart liquidation

[Service]
Environment=DRY_RUN=true
Environment=METRICS_PATH=/var/log/liquidation/metrics-soak.jsonl
