# Go-live mode (Phase 6): real execution, baseline metrics file.
# Install with: cp deploy/systemd/golive.conf /etc/systemd/system/liquidation.service.d/
# Then: systemctl daemon-reload && systemctl restart liquidation
#
# ⚠ This makes the bot broadcast real transactions with real money.
# Leave this file absent (or keep soak.conf installed) until the Phase 4
# go/no-go gate passes — see RUNBOOK.md and `pnpm diff:metrics`.

[Service]
Environment=DRY_RUN=false
Environment=METRICS_PATH=/var/log/liquidation/metrics.jsonl
